<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A CBT journaling app to help track thoughts, emotions, and behaviors" />
    <meta name="theme-color" content="#9FE870" />

    <!-- App icons -->
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>CBT Journal | Track Your Thoughts</title>

    <!-- Theme will be dynamically loaded by ThemeWrapper -->
    <link id="app-theme" rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/primereact@10.9.4/resources/themes/lara-light-indigo/theme.css" />

    <style>
      /* Theme-related CSS variables - Wise official colors */
      body.theme-light {
        /* Core colors */
        --wise-bright-green: #9FE870;
        --wise-forest-green: #163300;

        /* Secondary colors */
        --wise-bright-orange: #FFC091;
        --wise-bright-yellow: #FFEB69;
        --wise-bright-blue: #A0E1E1;
        --wise-bright-pink: #FFD7EF;
        --wise-dark-purple: #260A2F;
        --wise-dark-gold: #3A341C;
        --wise-dark-charcoal: #21231D;
        --wise-dark-maroon: #320707;

        /* Mapped variables for app */
        --wise-primary: var(--wise-bright-green);
        --wise-primary-light: #F0F9EA; /* Light tint of bright green */
        --wise-secondary: var(--wise-forest-green);
        --wise-accent: var(--wise-bright-orange);
        --wise-background: #FFFFFF;
        --wise-text: var(--wise-forest-green);
      }

      body.theme-dark {
        /* Core colors */
        --wise-bright-green: #9FE870;
        --wise-forest-green: #163300;

        /* Secondary colors */
        --wise-bright-orange: #FFC091;
        --wise-bright-yellow: #FFEB69;
        --wise-bright-blue: #A0E1E1;
        --wise-bright-pink: #FFD7EF;
        --wise-dark-purple: #260A2F;
        --wise-dark-gold: #3A341C;
        --wise-dark-charcoal: #21231D;
        --wise-dark-maroon: #320707;

        /* Mapped variables for app dark mode */
        --wise-primary: var(--wise-bright-green);
        --wise-primary-light: #1F3D12; /* Darker tint of forest green */
        --wise-secondary: var(--wise-dark-charcoal);
        --wise-accent: var(--wise-bright-orange);
        --wise-background: #121212;
        --wise-text: #FFFFFF;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Install prompt for Safari on iOS -->
    <div id="ios-install-prompt" style="display: none; position: fixed; bottom: 0; width: 100%; background-color: #f7f7f7; padding: 10px; text-align: center; box-shadow: 0 -2px 5px rgba(0,0,0,0.1);">
      <p>Install this app on your device: tap <span style="font-size: 1.5em;">⋯</span> then "Add to Home Screen"</p>
      <button onclick="document.getElementById('ios-install-prompt').style.display='none'" style="padding: 5px 10px; margin-left: 10px; border: none; background-color: #9FE870; border-radius: 5px;">Dismiss</button>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(error => {
              console.log('ServiceWorker registration failed: ', error);
            });
        });
      }

      // Show install prompt for iOS users
      if (navigator.standalone === false && navigator.userAgent.match(/iPhone|iPad|iPod/) && !window.matchMedia('(display-mode: standalone)').matches) {
        setTimeout(() => {
          document.getElementById('ios-install-prompt').style.display = 'block';
        }, 2000);
      }
    </script>
  </body>
</html>
